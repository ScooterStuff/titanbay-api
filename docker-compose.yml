services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: titanbay
      POSTGRES_PASSWORD: titanbay
      POSTGRES_DB: titanbay
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U titanbay -d titanbay']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://titanbay:titanbay@db:5432/titanbay
      PORT: '3000'
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    # Migrations run automatically on boot (see src/server.ts).

  # Opt-in one-shot seeding: `docker compose run --rm seed`
  seed:
    build: .
    profiles: ['seed']
    environment:
      DATABASE_URL: postgres://titanbay:titanbay@db:5432/titanbay
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    command: ['node', 'dist/scripts/seed.js']

volumes:
  pgdata:
